<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="robotGrad" x1="18" y1="14" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="userGrad" x1="10" y1="4" x2="46" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Balão 1: Usuário (lado esquerdo / trás) -->
  <g filter="url(#glow)">
    <path
      d="M10 12C10 7.58172 13.5817 4 18 4H38C42.4183 4 46 7.58172 46 12V25C46 29.4183 42.4183 33 38 33H20L10 41V12Z"
      fill="url(#userGrad)"
    />
    <!-- Silhueta de usuário -->
    <circle cx="28" cy="14.5" r="4" fill="#fafaf9" />
    <path
      d="M20 27C20 23 23.5 22 28 22C32.5 22 36 23 36 27"
      stroke="#fafaf9"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Balão 2: Robô (lado direito / frente com a cor roxa do app) -->
  <g filter="url(#glow)">
    <!-- Antena do Robô -->
    <path d="M36 17V10" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="36" cy="9" r="2.5" fill="#ec4899" />

    <!-- Corpo do balão robô -->
    <path
      d="M54 23C54 18.5817 50.4183 15 46 15H26C21.5817 15 18 18.5817 18 23V37C18 41.4183 21.5817 45 26 45H44L54 53V23Z"
      fill="url(#robotGrad)"
    />
    
    <!-- Olhos do Robô -->
    <circle cx="30" cy="28" r="2.8" fill="#ffffff" />
    <circle cx="30" cy="28" r="1.2" fill="#3b82f6" />
    
    <circle cx="42" cy="28" r="2.8" fill="#ffffff" />
    <circle cx="42" cy="28" r="1.2" fill="#3b82f6" />

    <!-- Sorriso amigável do Robô -->
    <path
      d="M33 36C34.8 38 37.2 38 39 36"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>